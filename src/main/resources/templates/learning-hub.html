
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skill Learning Hub | SkillBridge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 18px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7f6;
            color: #20352e;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        a {
            color: #287a5b;
            text-decoration: none;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 32px;
        }

        .subtitle {
            color: #718078;
            margin-bottom: 28px;
        }

        .filter {
            background: white;
            padding: 22px;
            border: 1px solid #e3ebe6;
            border-radius: 15px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 9px;
            font-size: 15px;
        }

        select {
            background: white;
            border: 1px solid #d6e0d9;
        }

        button {
            margin-top: 12px;
            background: #1d5946;
            color: white;
            border: none;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e3ebe6;
            border-radius: 15px;
            padding: 22px;
        }

        .icon {
            font-size: 32px;
            margin-bottom: 14px;
        }

        .tag {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #e3f1e9;
            color: #176447;
            font-size: 12px;
            margin: 4px 4px 8px 0;
        }

        .description {
            color: #718078;
            line-height: 1.6;
            min-height: 48px;
        }

        .watch {
            display: inline-block;
            margin-top: 12px;
            padding: 11px 15px;
            background: #1d5946;
            color: white;
            border-radius: 8px;
        }

        .empty {
            background: white;
            border-radius: 12px;
            padding: 24px;
            color: #718078;
        }

        @media (min-width: 600px) {
            .filter-row {
                display: grid;
                grid-template-columns: 1fr 180px;
                gap: 16px;
                align-items: end;
            }

            button {
                margin-top: 0;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <a href="/home">← Back to Dashboard</a>

    <h1>Skill Learning Hub 🎓</h1>
    <p class="subtitle">
        Explore useful learning resources and grow your skills one lesson at a time.
    </p>

    <form class="filter"
          th:action="@{/learning-hub}"
          method="get">

        <div class="filter-row">
            <div>
                <label for="skillId">Choose a skill to learn</label>

                <select id="skillId" name="skillId">
                    <option value="">All skills</option>

                    <option th:each="skill : ${skills}"
                            th:value="${skill.skillId}"
                            th:text="${skill.skillName}"
                            th:selected="${selectedSkillId != null
                                and selectedSkillId.equals(skill.skillId)}">
                        Java
                    </option>
                </select>
            </div>

            <button type="submit">Explore Resources</button>
        </div>
    </form>

    <h2>Learning Resources</h2>

    <p class="empty" th:if="${#lists.isEmpty(resources)}">
        No resources found for this skill yet. Check back soon!
    </p>

    <div class="grid">
        <div class="card" th:each="resource : ${resources}">

            <div class="icon">📚</div>

            <h3 th:text="${resource.title}">
                Java Basics
            </h3>

            <span class="tag"
                  th:text="${resource.skill.skillName}">
                Java
            </span>

            <span class="tag"
                  th:text="${resource.difficulty}">
                Beginner
            </span>

            <p>
                <strong>Topic:</strong>
                <span th:text="${resource.topic}">Java Basics</span>
            </p>

            <p class="description"
               th:text="${resource.description}">
                Learn the fundamentals.
            </p>

            <a class="watch"
               th:href="${resource.videoUrl}"
               target="_blank"
               rel="noopener noreferrer">
                Watch / Explore →
            </a>

        </div>
    </div>

</div>
</body>
</html>
