
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Private Chat | SkillBridge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f7f5;
            color: #20352e;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header, .chat-box, .message-form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #e2ebe5;
        }

        h1 {
            color: #173d35;
            margin-bottom: 5px;
        }

        .muted {
            color: #718078;
            font-size: 14px;
        }

        .messages {
            min-height: 250px;
            max-height: 450px;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            max-width: 75%;
            padding: 12px 15px;
            margin: 12px 0;
            border-radius: 12px;
            overflow-wrap: anywhere;
        }

        .sent {
            margin-left: auto;
            background: #dff1e7;
        }

        .received {
            margin-right: auto;
            background: #edf0ee;
        }

        .sender {
            font-size: 12px;
            font-weight: bold;
            color: #176447;
            margin-bottom: 5px;
        }

        .time {
            font-size: 11px;
            color: #718078;
            margin-top: 7px;
        }

        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d6e0d9;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #1d5946;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #287a5b;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 18px;
            color: #287a5b;
            text-decoration: none;
        }

        .empty {
            text-align: center;
            color: #718078;
            padding: 35px 10px;
        }
    </style>
</head>

<body>
<div class="container">

    <a class="back-link" th:href="@{/requests}">
        ← Back to Learning Requests
    </a>

    <div class="header">
        <h1>Private Learning Chat 💬</h1>

        <p class="muted">
            Skill:
            <strong th:text="${request.skill.skillName}">Java</strong>
        </p>

        <p class="muted">
            You are chatting with:
            <strong th:text="${request.requester.userId == currentUser.userId
                ? request.receiver.fullName
                : request.requester.fullName}">
                Student
            </strong>
        </p>

        <p class="muted">
            This conversation is available only to the two students
            in this accepted learning request.
        </p>
    </div>

    <div class="chat-box">
        <div class="messages" id="messages">

            <p class="empty" th:if="${#lists.isEmpty(messages)}">
                No messages yet. Start your learning conversation!
            </p>

            <div th:each="message : ${messages}"
                 th:class="${message.sender.userId == currentUser.userId
                    ? 'message sent' : 'message received'}">

                <div class="sender"
                     th:text="${message.sender.userId == currentUser.userId
                        ? 'You' : message.sender.fullName}">
                    Student
                </div>

                <div th:text="${message.content}">
                    Message content
                </div>

                <div class="time"
                     th:if="${message.sentAt != null}"
                     th:text="${#temporals.format(message.sentAt, 'dd MMM yyyy, hh:mm a')}">
                    Time
                </div>
            </div>

        </div>
    </div>

    <form class="message-form"
          th:action="@{/chat/{id}/send(id=${request.requestId})}"
          method="post">

        <label for="content"><strong>Your message</strong></label>

        <textarea id="content"
                  name="content"
                  rows="3"
                  maxlength="2000"
                  placeholder="Type your message here..."
                  required></textarea>

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit">Send Message</button>
    </form>

</div>

<script>
    const messages = document.getElementById("messages");
    messages.scrollTop = messages.scrollHeight;
</script>

</body>
</html>
